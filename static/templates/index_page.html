{% extends "base.html" %}

{% block title %}
    <title>Memo</title>
{% endblock title %}
{% block content %}
    {% if result %}
    <p>
        {{ result }}
    </p>
    {% endif %}

    <button formaction="*"><a href="/create_note"> Create new note</a></button>
    <button><a href="/note">Show my notes</a></button>
    <button>Delete my notes</button>

    {% if notes %}
        <ul>
        {% for note in notes %}
            <li><a href="../note/{{ note.id }}">{{ note.title }}</a></li>
        {% endfor %}
        </ul>
    {% endif %}
{% endblock content %}
